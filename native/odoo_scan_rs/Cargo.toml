[package]
name = "odoo_scan_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "odoo_scan_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
rayon = "1"
indexmap = "2"
regex = "1"
roxmltree = "0.20"
csv = "1"
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
