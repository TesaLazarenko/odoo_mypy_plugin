[project]
name = "odoo-typing"
version = "0.1.0"
description = "mypy plugin that understands the Odoo ORM: models, _inherit, fields and recordsets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mypy>=2.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_typing"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
# Settings for type-checking the plugin's own code (not Odoo code).
files = ["src/odoo_typing"]
strict = true
