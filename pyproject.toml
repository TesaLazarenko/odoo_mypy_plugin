[project]
name = "odoo-typing"
version = "0.1.0"
description = "mypy plugin that understands the Odoo ORM: models, _inherit, fields and recordsets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mypy>=2.1,<2.5"]  # internal mypy APIs: tested on 2.1 and 2.4
keywords = ["odoo", "mypy", "mypy-plugin", "typing", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.scripts]
odoo-typing-root = "odoo_typing.overlay:main"
odoo-typing-baseline = "odoo_typing.baseline:main"
odoo-typing-stubs = "odoo_typing.stubs:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_typing"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools/bench"]
markers = ["odoo(*versions): run only when the e2e tests target one of these Odoo versions"]

[tool.mypy]
# Settings for type-checking the plugin's own code (not Odoo code).
files = ["src/odoo_typing", "tools/bench"]
strict = true
