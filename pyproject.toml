[project]
name = "odoo-typing"
version = "0.1.0"
description = "mypy plugin that understands the Odoo ORM: models, _inherit, fields and recordsets"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
authors = [{ name = "Taras Shabaranskyi", email = "shabaranskij@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["mypy>=2.1,<2.5"]  # internal mypy APIs: tested on 2.1 and 2.4
keywords = ["odoo", "mypy", "mypy-plugin", "typing", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TesaLazarenko/odoo_mypy_plugin"
Repository = "https://github.com/TesaLazarenko/odoo_mypy_plugin"
Issues = "https://github.com/TesaLazarenko/odoo_mypy_plugin/issues"
Changelog = "https://github.com/TesaLazarenko/odoo_mypy_plugin/blob/main/CHANGELOG.md"

[project.scripts]
odoo-typing-root = "odoo_typing.overlay:main"
odoo-typing-baseline = "odoo_typing.baseline:main"
odoo-typing-stubs = "odoo_typing.stubs:main"

[dependency-groups]
dev = ["pylint>=4.1", "pytest>=8", "pytest-mock>=3.14", "pytest-xdist>=3.6", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_typing"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true  # only preview rules listed by full code below (PLR1702)
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PTH",     # pathlib
    "RUF",     # ruff-specific
    "RET",     # early return: no else after return/raise/continue/break
    "ANN",     # annotations
    "D",       # docstrings
    "PLR5501", # else: if -> elif
    "PLR1702", # max nesting depth (preview)
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pylint]
max-nested-blocks = 3

[tool.pylint.main]
# ruff covers everything else; pylint only bans single-character names
disable = ["all"]
enable = ["disallowed-name"]
ignore-paths = ["tests/fixtures/.*"]

[tool.pylint.basic]
bad-names-rgxs = ["^[a-zA-Z0-9]$"]
good-names = ["_"]  # drop pylint's default i/j/k exemptions; "_" stays the throwaway name

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools/bench", "tools/fields"]
markers = ["odoo(*versions): run only when the e2e tests target one of these Odoo versions"]

[tool.mypy]
# Settings for type-checking the plugin's own code (not Odoo code).
files = ["src/odoo_typing", "tools/bench"]
strict = true
