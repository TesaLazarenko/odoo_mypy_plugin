# Lint, type-check and test the plugin against each supported Odoo version and the
# oldest and newest supported mypy. Odoo comes from tools/odoo/fetch.sh (a shallow,
# sparse checkout, cached between runs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run pylint src tests tools
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo: ["17.0", "18.0", "19.0", "20.0"]
        mypy: ["2.1.0", "2.4.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"  # Odoo 20's sources need 3.12
      - uses: actions/cache@v4
        with:
          path: ~/.cache/odoo-typing/odoo/${{ matrix.odoo }}
          key: odoo-${{ matrix.odoo }}-v1
      - run: uv sync
      - run: uv pip install "mypy==${{ matrix.mypy }}"
      - name: Fetch Odoo ${{ matrix.odoo }}
        run: echo "ODOO_PATH=$(tools/odoo/fetch.sh ${{ matrix.odoo }} --update)" >> "$GITHUB_ENV"
      - name: Test
        run: uv run --no-sync pytest -q -n 2  # the runner has 2 CPUs
        env:
          ODOO_REQUIRED: "1"  # no silently skipped end-to-end tests
