# Weekly: the tests on the newest commit of each Odoo branch, to learn early what
# moving the pins of tools/odoo/commits.txt would take. A red run changes nothing in
# CI; the summary lists the commits tested (the new pins once the run is green).
name: Odoo latest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: odoo-latest
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.17"

jobs:
  test:
    name: test (Odoo ${{ matrix.odoo }} latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        odoo: ["17.0", "18.0", "19.0", "20.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Pinned Odoo commit
        id: odoo
        run: |
          commit=$(awk -v v="${{ matrix.odoo }}" '$1 == v { print $2 }' tools/odoo/commits.txt)
          [[ -n "$commit" ]] || { echo "::error::no pin for ${{ matrix.odoo }} in tools/odoo/commits.txt"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # The pinned checkout that CI saves (same key, see ci.yml), so that only the difference
      # is fetched; never saved here.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/odoo-typing/odoo/${{ matrix.odoo }}
          key: odoo-${{ matrix.odoo }}-${{ steps.odoo.outputs.commit }}-${{ hashFiles('tools/odoo/fetch.sh') }}
          restore-keys: |
            odoo-${{ matrix.odoo }}-${{ steps.odoo.outputs.commit }}-
            odoo-${{ matrix.odoo }}-
      - name: Fetch the newest Odoo ${{ matrix.odoo }}
        run: |
          odoo_path=$(tools/odoo/fetch.sh "${{ matrix.odoo }}" --latest)
          echo "ODOO_PATH=$odoo_path" >> "$GITHUB_ENV"
          src=~/.cache/odoo-typing/odoo/${{ matrix.odoo }}/src
          echo "${{ matrix.odoo }} $(git -C "$src" rev-parse HEAD)  # $(git -C "$src" log -1 --format=%cs) (pinned: ${{ steps.odoo.outputs.commit }})" >> "$GITHUB_STEP_SUMMARY"
      - run: uv sync --locked
      - name: Test
        timeout-minutes: 20
        run: uv run --no-sync pytest -q -n 2
        env:
          ODOO_REQUIRED: "1"
